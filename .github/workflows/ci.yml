name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: new advisories can appear without any change to the code

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pytest pip-audit
      - run: python -m pytest tests -q
      # requirements.txt is not pinned, so this audits what a fresh install gets today (see SECURITY.md, known risk 6).
      - run: pip-audit -r requirements.txt

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test "tests_js/*.test.js"
      - run: npm audit --prefix electron --audit-level=high
